## configuracion pare el pool de conexion de varias conexiones a la vez tanto para tuval como para dynamics

dynamics.datasource.maximum-pool-size=20
dynamics.datasource.minimum-idle=5
dynamics.datasource.idle-timeout=300000
dynamics.datasource.connection-timeout=30000
dynamics.datasource.max-lifetime=1800000

tuval.datasource.maximum-pool-size=20
tuval.datasource.minimum-idle=5
tuval.datasource.idle-timeout=300000
tuval.datasource.connection-timeout=30000
tuval.datasource.max-lifetime=1800000

# Esto evita el error de "Metadata" porque el pool verifica la salud antes de entregártela.
dynamics.datasource.connection-test-query=SELECT 1
tuval.datasource.connection-test-query=SELECT 1
dynamics.datasource.validation-timeout=3000
tuval.datasource.validation-timeout=3000
