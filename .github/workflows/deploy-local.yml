name: Validar y desplegar recursosHumanos local

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Pruebas y JAR (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify -DskipTests=false

      - name: Verificar que el JAR no contiene perfiles privados
        shell: bash
        run: |
          set -euo pipefail
          jar tf target/recursosHumanos-0.0.1-SNAPSHOT.jar > target/jar-entries.txt
          if grep -Eq 'BOOT-INF/classes/application-(dev|qa|prod)\.properties$' target/jar-entries.txt; then
            echo '::error::El JAR contiene configuración privada.'
            exit 1
          fi

      - name: Guardar JAR validado para despliegue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recursoshumanos-jar-${{ github.sha }}
          path: target/recursosHumanos-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Desplegar recursoshumanos en srv-docker00
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, Linux, X64, recursoshumanos-local]
    timeout-minutes: 15
    concurrency:
      group: recursoshumanos-local-deployment
      cancel-in-progress: false
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      EXPECTED_HOSTNAME: srv-docker00
      SPRING_PROFILE: dev
      CONFIG_DIR: /opt/recursoshumanos/config
      CONTAINER_NAME: recursoshumanos
      IMAGE_TAG: recursoshumanos:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      HEALTHCHECK_URL: ${{ vars.RECURSOS_HUMANOS_HEALTHCHECK_URL || 'http://127.0.0.1:8004/actuator/health' }}
    steps:
      - name: Checkout del mismo commit validado
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Descargar JAR validado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recursoshumanos-jar-${{ github.sha }}
          path: target

      - name: Verificar destino y acceso a Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "$EXPECTED_HOSTNAME"
          docker info > /dev/null
          test -s target/recursosHumanos-0.0.1-SNAPSHOT.jar

      - name: Construir imagen local
        run: docker build --tag "$IMAGE_TAG" .

      - name: Evitar desplegar un commit superado por otro push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/develop" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo '::error::develop ya tiene otro commit; este trabajo no reemplazará recursoshumanos.'
            exit 1
          fi

      - name: Desplegar y verificar (restaurar anterior si falla)
        run: bash scripts/deploy-local.sh
